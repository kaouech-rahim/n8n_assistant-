services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: n8n-assistant:latest
    container_name: n8n-assistant
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - db_data:/app/data          # SQLite database (persistent)
      - uploads:/app/public/avatars # Avatar uploads (persistent)
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/app.db
      - N8N_URL=${N8N_URL:-http://host.docker.internal:5678}
      - N8N_WEBHOOK_BASE=${N8N_WEBHOOK_BASE:-http://host.docker.internal:5678/webhook}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - assistant_net

  # ── Uncomment to run n8n in the same stack ────────────────────────────────────
  # n8n:
  #   image: n8nio/n8n:latest
  #   container_name: n8n
  #   restart: unless-stopped
  #   ports:
  #     - "5678:5678"
  #   volumes:
  #     - n8n_data:/home/node/.n8n
  #   environment:
  #     - N8N_HOST=0.0.0.0
  #     - N8N_PORT=5678
  #     - WEBHOOK_URL=http://n8n:5678
  #   networks:
  #     - assistant_net

volumes:
  db_data:
  uploads:
  # n8n_data:

networks:
  assistant_net:
    driver: bridge
