services:

  # ── Frontend : Nginx + React build ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: n8n-assistant-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - assistant_net

  # ── Backend : Express + SQLite ────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: n8n-assistant-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - db_data:/app/data
      - uploads:/app/public/avatars
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/app.db
      - N8N_URL=http://host.docker.internal:5678
      - N8N_WEBHOOK_BASE=http://host.docker.internal:5678/webhook
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - assistant_net

volumes:
  db_data:
  uploads:

networks:
  assistant_net:
    driver: bridge
